openapi: 3.1.0
info:
  title: OpenForge / MOS Hub API
  version: 1.0.4
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Healthy}
  /v1/certifications/evaluate:
    post:
      operationId: evaluateCertification
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificationRequest'}
      responses:
        '200':
          description: Deterministic certification decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificationResponse'}
        '422': {description: Invalid request or unknown policy}
  /v1/certifications/from-run:
    post:
      operationId: evaluateCertificationFromRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [run_id, attestations]}
      responses:
        '200': {description: Certification with metrics derived from persisted run}
        '422': {description: Run or attestations are not certifiable}
  /v1/projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201': {description: Project created}
  /v1/strategies:
    post:
      operationId: createStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StrategyCreate'}
      responses:
        '201': {description: Strategy created}
  /v1/strategies/{strategy_id}/versions:
    post:
      operationId: createStrategyVersion
      parameters:
        - in: path
          name: strategy_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StrategyVersionCreate'}
      responses:
        '201': {description: Immutable strategy version created}
        '409': {description: Version already exists}
  /v1/datasets/versions:
    post:
      operationId: createDatasetVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '201': {description: Dataset version registered}
  /v1/runs:
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '201': {description: Reproducible run completed}
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - in: path
          name: run_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Run result}
  /v1/runs/{run_id}/replay:
    post:
      operationId: replayRun
      parameters:
        - in: path
          name: run_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Replayed run and hash comparison}
  /v1/validations:
    post:
      operationId: createValidationSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [strategy_id, strategy_version, mode]}
      responses:
        '201': {description: Paper or shadow validation session created}
  /v1/validations/{session_id}/observations:
    post:
      operationId: addValidationObservation
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string}
      responses:
        '204': {description: Observation persisted}
  /v1/validations/{session_id}/finalize:
    post:
      operationId: finalizeValidationSession
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Calculated validation verdict}
  /v1/deployments:
    post:
      operationId: createCanaryDeployment
      responses:
        '201': {description: Locked canary deployment created}
  /v1/deployments/{deployment_id}/arm:
    post:
      operationId: armDeployment
      responses:
        '200': {description: Deployment armed after human confirmation}
  /v1/deployments/{deployment_id}/activate:
    post:
      operationId: activateLockedDeployment
      responses:
        '200': {description: Deployment active but gateway remains locked}
  /v1/deployments/{deployment_id}/risk:
    post:
      operationId: submitRiskSnapshot
      responses:
        '200': {description: Risk state and possible automatic suspension}
  /v1/deployments/{deployment_id}/pause:
    post:
      operationId: pauseDeployment
      responses:
        '200': {description: Deployment suspended and gateway locked}
  /v1/strategies/{strategy_id}/readiness:
    get:
      operationId: getReadiness
      parameters:
        - in: path
          name: strategy_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Readiness status}
components:
  schemas:
    ProjectCreate:
      type: object
      required: [owner_id, name]
      properties:
        owner_id: {type: string}
        name: {type: string}
        visibility: {type: string, default: private}
    StrategyCreate:
      type: object
      required: [project_id, name, thesis, market, venue, timeframe]
      properties:
        project_id: {type: string}
        name: {type: string}
        thesis: {type: string}
        market: {type: string}
        venue: {type: string}
        timeframe: {type: string}
    StrategyVersionCreate:
      type: object
      required: [version, code_hash, config_hash]
      properties:
        version: {type: string}
        code_hash: {type: string, minLength: 16}
        config_hash: {type: string, minLength: 16}
        parent_id: {type: [string, 'null']}
    CertificationRequest:
      type: object
      required: [project_id, strategy_id, strategy_version, evidence]
      properties:
        project_id: {type: string}
        strategy_id: {type: string}
        strategy_version: {type: string}
        policy_version: {type: string, default: mos-hub-v1}
        evidence: {$ref: '#/components/schemas/Evidence'}
    Evidence:
      type: object
      additionalProperties: false
      required: [definition_complete, dataset_provenance_verified, reproducible, oos_validated, walk_forward_validated, paper_validated, shadow_validated, security_controls_validated, rr_planned, profit_factor_net, expectancy_net, sample_size, max_drawdown_pct, shadow_execution_gap_bps, code_hash, dataset_hash, manifest_hash]
      properties:
        definition_complete: {type: boolean}
        dataset_provenance_verified: {type: boolean}
        reproducible: {type: boolean}
        oos_validated: {type: boolean}
        walk_forward_validated: {type: boolean}
        paper_validated: {type: boolean}
        shadow_validated: {type: boolean}
        security_controls_validated: {type: boolean}
        rr_planned: {type: number, exclusiveMinimum: 0}
        profit_factor_net: {type: number, minimum: 0}
        expectancy_net: {type: number}
        sample_size: {type: integer, minimum: 1}
        max_drawdown_pct: {type: number, minimum: 0}
        shadow_execution_gap_bps: {type: number, minimum: 0}
        code_hash: {type: string, minLength: 16}
        dataset_hash: {type: string, minLength: 16}
        manifest_hash: {type: string, minLength: 16}
    CertificationResponse:
      type: object
      required: [decision, status, ready_for_live, score, blocking_reasons, gates, policy_version, evidence_set_hash]
      properties:
        decision: {type: string, enum: [PASS, FAIL]}
        status: {type: string}
        ready_for_live: {type: boolean}
        score: {type: number}
        blocking_reasons: {type: array, items: {type: string}}
        gates: {type: array, items: {type: object}}
        policy_version: {type: string}
        evidence_set_hash: {type: string}
